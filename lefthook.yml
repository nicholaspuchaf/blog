#
#   Refer for explanation to following link:
#   https://lefthook.dev/configuration/
#
# pre-push:
#   jobs:
#     - name: packages audit
#       tags:
#         - frontend
#         - security
#       run: yarn audit
#
#     - name: gems audit
#       tags:
#         - backend
#         - security
#       run: bundle audit
#
pre-commit:
  parallel: true
  commands:
    linter:
      glob: "**/*.{js,ts,jsx,tsx,svelte}"
      run: bun eslint {staged_files}
    
    formatter:
      glob: "**/*.{js,ts,jsx,tsx,svelte}"
      run: bun prettier --check {staged_files}
      stage_fixed: true
